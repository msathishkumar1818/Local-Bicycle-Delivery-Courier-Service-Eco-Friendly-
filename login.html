<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Client Portal Login & Registration | EcoCycle Express</title>
  <meta name="description" content="Access your EcoCycle Express client portal. Book zero-emission bicycle couriers, monitor live telemetry dispatch, download carbon offset ledgers, and manage business invoicing.">
  <meta name="keywords" content="bicycle courier login, client portal, eco delivery tracking, business dispatch login">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/logo/logo.png">
  
  <!-- Stylesheets (Zero inline styles) -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="auth-page-body">

  <!-- ========================================================================
       1. BRANDED PRELOADER
       ======================================================================== -->
  <div id="preloader" role="status" aria-live="polite" aria-label="Loading page">
    <div class="preloader-spinner-wrap">
      <img src="assets/images/logo/logo.png" alt="EcoCycle Express Logo" class="preloader-logo-img" width="56" height="56">
      <div class="preloader-ring"></div>
    </div>
    <span class="preloader-text">Loading Portal...</span>
  </div>

  <!-- ========================================================================
       2. FLOATING TOP-RIGHT ACTION CONTROLS (HOME, RTL, DARK MODE)
       ======================================================================== -->
  <aside class="auth-top-actions" aria-label="Portal controls">
    
    <!-- Home Navigation Pill -->
    <a href="index.html" class="auth-nav-pill" aria-label="Return to EcoCycle Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span>Home</span>
    </a>

    <!-- RTL / LTR Direction Toggle -->
    <button type="button" class="auth-nav-pill rtl-toggle-btn" aria-label="Switch text direction">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="16 3 21 3 21 8"></polyline>
        <line x1="4" y1="20" x2="21" y2="3"></line>
        <polyline points="21 16 21 21 16 21"></polyline>
        <line x1="15" y1="15" x2="21" y2="21"></line>
        <line x1="4" y1="4" x2="9" y2="9"></line>
      </svg>
      <span>RTL</span>
    </button>

    <!-- Dark / Light Theme Toggle -->
    <button type="button" class="auth-nav-pill theme-toggle-btn" aria-label="Switch color theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <span class="theme-text-label">DARK</span>
    </button>

  </aside>

  <!-- ========================================================================
       3. CENTERED AUTHENTICATION CARD SHELL (REFERENCE MODEL)
       ======================================================================== -->
  <main class="auth-page-wrapper">
    <div class="auth-box-card">

      <!-- Brand Identity Badge (Click to Home) -->
      <a href="index.html" class="auth-brand-badge" aria-label="Return to EcoCycle Homepage">
        <img src="assets/images/logo/logo.png" alt="EcoCycle Express Logo" class="auth-brand-logo" width="40" height="40">
        <div class="auth-brand-info">
          <span class="auth-brand-title">ECOCYCLE EXPRESS</span>
          <span class="auth-brand-sub">COURIER &amp; DISPATCH</span>
        </div>
      </a>

      <!-- Welcome Headings -->
      <h1 class="auth-card-title">Welcome back</h1>
      <p class="auth-card-subtitle">Enter your credentials to access your account dashboard</p>

      <!-- Segmented Pill Tabs Navigation -->
      <div class="auth-tabs-track" role="tablist" aria-label="Sign in or Register">
        <button type="button" class="auth-tab-pill active" role="tab" id="tab-btn-signin" aria-selected="true" aria-controls="panel-signin">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          <span>SIGN IN</span>
        </button>
        <button type="button" class="auth-tab-pill" role="tab" id="tab-btn-register" aria-selected="false" aria-controls="panel-register">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="8.5" cy="7" r="4"></circle>
            <line x1="20" y1="8" x2="20" y2="14"></line>
            <line x1="23" y1="11" x2="17" y2="11"></line>
          </svg>
          <span>REGISTER</span>
        </button>
      </div>

      <!-- --------------------------------------------------------------------
           PANEL 1: SIGN IN FORM
           -------------------------------------------------------------------- -->
      <div class="auth-panel active" id="panel-signin" role="tabpanel" aria-labelledby="tab-btn-signin">
        <form action="dashboard.html" method="get">
          
          <!-- Email Field -->
          <div class="auth-field-group">
            <label for="signin-email" class="auth-field-label">EMAIL ADDRESS</label>
            <div class="auth-field-input-wrap">
              <svg class="auth-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
              <input type="email" id="signin-email" class="auth-field-input" placeholder="client@ecocycle.com" required autocomplete="email">
            </div>
          </div>

          <!-- Password Field -->
          <div class="auth-field-group">
            <div class="auth-field-label-row">
              <label for="signin-password" class="auth-field-label">PASSWORD</label>
              <a href="#" class="auth-field-forgot">Forgot password?</a>
            </div>
            <div class="auth-field-input-wrap">
              <svg class="auth-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input type="password" id="signin-password" class="auth-field-input has-eye" placeholder="••••••••••••" required autocomplete="current-password">
              <button type="button" class="auth-password-toggle" aria-label="Toggle password visibility">
                <svg class="eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="eye-hide is-hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <!-- Remember Me Checkbox -->
          <div class="auth-checkbox-row">
            <label class="auth-custom-checkbox">
              <input type="checkbox" id="remember-me" checked>
              <span>Remember me for 30 days</span>
            </label>
          </div>

          <!-- Primary Submit Button -->
          <button type="submit" class="auth-btn-primary">
            <span>SIGN IN</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>

          <!-- Divider -->
          <div class="auth-divider">
            <span>OR CONTINUE WITH</span>
          </div>

          <!-- Social Buttons -->
          <div class="auth-social-row">
            <button type="button" class="auth-social-btn" aria-label="Sign in with Google">
              <svg viewBox="0 0 24 24" class="social-icon" aria-hidden="true">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
                <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.97 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
              </svg>
              <span>Google</span>
            </button>
            <button type="button" class="auth-social-btn" aria-label="Sign in with Apple">
              <svg viewBox="0 0 24 24" fill="currentColor" class="social-icon" aria-hidden="true">
                <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.84c.66-.82 1.11-1.96.99-3.1-.96.04-2.18.66-2.84 1.45-.58.69-1.1 1.84-.96 2.96 1.08.08 2.15-.55 2.81-1.31z"/>
              </svg>
              <span>Apple</span>
            </button>
          </div>

          <!-- Bottom Switch Link -->
          <div class="auth-card-footer">
            <span>Don't have an account?</span>
            <a href="#panel-register" class="auth-switch-accent" data-switch-tab="panel-register">Register now</a>
          </div>

        </form>
      </div>

      <!-- --------------------------------------------------------------------
           PANEL 2: REGISTER FORM
           -------------------------------------------------------------------- -->
      <div class="auth-panel" id="panel-register" role="tabpanel" aria-labelledby="tab-btn-register" hidden>
        <form action="dashboard.html" method="get">
          
          <!-- Full Name -->
          <div class="auth-field-group">
            <label for="register-name" class="auth-field-label">FULL NAME</label>
            <div class="auth-field-input-wrap">
              <svg class="auth-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input type="text" id="register-name" class="auth-field-input" placeholder="Marcus Vance" required autocomplete="name">
            </div>
          </div>

          <!-- Company Name -->
          <div class="auth-field-group">
            <label for="register-company" class="auth-field-label">COMPANY OR CLINIC</label>
            <div class="auth-field-input-wrap">
              <svg class="auth-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
              </svg>
              <input type="text" id="register-company" class="auth-field-input" placeholder="Vance BioTech Diagnostics" required autocomplete="organization">
            </div>
          </div>

          <!-- Email Address -->
          <div class="auth-field-group">
            <label for="register-email" class="auth-field-label">BUSINESS EMAIL</label>
            <div class="auth-field-input-wrap">
              <svg class="auth-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
              <input type="email" id="register-email" class="auth-field-input" placeholder="marcus@vancebiotech.com" required autocomplete="email">
            </div>
          </div>

          <!-- Password -->
          <div class="auth-field-group">
            <label for="register-password" class="auth-field-label">CREATE PASSWORD</label>
            <div class="auth-field-input-wrap">
              <svg class="auth-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input type="password" id="register-password" class="auth-field-input has-eye" placeholder="At least 8 characters" required autocomplete="new-password">
              <button type="button" class="auth-password-toggle" aria-label="Toggle password visibility">
                <svg class="eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="eye-hide is-hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <!-- Terms Checkbox -->
          <div class="auth-checkbox-row">
            <label class="auth-custom-checkbox">
              <input type="checkbox" id="accept-terms" required checked>
              <span>I agree to eco-courier dispatch terms &amp; policies</span>
            </label>
          </div>

          <!-- Primary Register Button -->
          <button type="submit" class="auth-btn-primary">
            <span>REGISTER</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>

          <!-- Divider -->
          <div class="auth-divider">
            <span>OR CONTINUE WITH</span>
          </div>

          <!-- Social Buttons -->
          <div class="auth-social-row">
            <button type="button" class="auth-social-btn" aria-label="Sign up with Google">
              <svg viewBox="0 0 24 24" class="social-icon" aria-hidden="true">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
                <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.97 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
              </svg>
              <span>Google</span>
            </button>
            <button type="button" class="auth-social-btn" aria-label="Sign up with Apple">
              <svg viewBox="0 0 24 24" fill="currentColor" class="social-icon" aria-hidden="true">
                <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.84c.66-.82 1.11-1.96.99-3.1-.96.04-2.18.66-2.84 1.45-.58.69-1.1 1.84-.96 2.96 1.08.08 2.15-.55 2.81-1.31z"/>
              </svg>
              <span>Apple</span>
            </button>
          </div>

          <!-- Bottom Switch Link -->
          <div class="auth-card-footer">
            <span>Already have an account?</span>
            <a href="#panel-signin" class="auth-switch-accent" data-switch-tab="panel-signin">Sign In</a>
          </div>

        </form>
      </div>

    </div>
  </main>

  <!-- External JavaScript (Zero inline scripts) -->
  <script src="assets/js/main.js"></script>
</body>
</html>
